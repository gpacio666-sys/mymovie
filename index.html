<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1f44">
<title>Cineteca</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#0d1626;--mute:#5d6b82;--line:#d6dce8;--blue:#0a4bd8;--blue-ink:#fff;--k4:#111;--dvd:#8b93a3}
@media(prefers-color-scheme:dark){:root{--bg:#0b111d;--card:#141c2c;--ink:#e8edf7;--mute:#93a0b8;--line:#25304a;--blue:#4b82ff;--k4:#f2f2f2;--dvd:#6f7889}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next","Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{background:#0a1f44;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
h1{margin:0 0 10px;font-size:22px;letter-spacing:.2px}
.fmt{display:flex;gap:8px}
.fmt button{flex:1;padding:9px 4px;border-radius:10px;border:2px solid #ffffff44;background:transparent;color:#fff;font-weight:700;font-size:14px}
.fmt button.on{background:#fff;color:#0a1f44;border-color:#fff}
main{padding:14px;max-width:720px;margin:auto}
.row{display:flex;gap:8px;margin-bottom:10px}
.big{flex:1;padding:16px 8px;border-radius:14px;border:0;background:var(--blue);color:var(--blue-ink);font-size:16px;font-weight:700}
.big.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
input[type=search],input[type=text]{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.btn{padding:10px 14px;border-radius:10px;border:0;background:var(--blue);color:var(--blue-ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
.btn.del{background:transparent;color:#d33;border:1px solid var(--line)}
.status{color:var(--mute);font-size:14px;min-height:20px;margin:6px 2px}
.card{display:flex;gap:12px;background:var(--card);border-radius:14px;padding:10px;margin-bottom:10px;border:1px solid var(--line)}
.card img,.ph{width:70px;height:105px;object-fit:cover;border-radius:6px;background:var(--line);flex:none}
.card .t{font-weight:700}
.meta{color:var(--mute);font-size:13px}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:12px;font-weight:800;color:#fff;margin-right:6px}
.tag.k4{background:var(--k4);color:var(--bg)}.tag.bd{background:var(--blue);color:var(--blue-ink)}.tag.dvd{background:var(--dvd)}
.acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
details summary{cursor:pointer;color:var(--blue);font-size:13px}
details p{margin:6px 0 0;font-size:14px}
.seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;padding:10px;border:0;background:var(--card);color:var(--mute);font-weight:700}
.seg button.on{background:var(--blue);color:var(--blue-ink)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:16px 0;border:0;background:none;color:var(--mute);font-weight:700;font-size:15px}
nav button.on{color:var(--blue);box-shadow:inset 0 3px 0 var(--blue)}
.hide{display:none}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#0a1f44;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
.foot{display:flex;gap:8px;margin-top:18px}
.chips{display:flex;gap:6px;margin-bottom:10px}.chips.hide,.foot.hide{display:none}
.chips button{flex:1;padding:8px 2px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mute);font-weight:700;font-size:13px}
.chips button.on{background:var(--ink);color:var(--bg)}
#cam{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}#cam.hide{display:none}
#cam video{flex:1;min-height:0;width:100%;object-fit:cover}
#cam .bar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:#000}
#cam .bar .btn{color:#fff;border-color:#fff5;min-width:84px}
#cam .hint{position:absolute;top:calc(14px + env(safe-area-inset-top));left:0;right:0;text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 4px #000;padding:0 16px;z-index:1}
.shutter{width:68px;height:68px;border-radius:50%;border:5px solid #fff;background:#ffffff33}
</style>
</head>
<body>
<header>
  <h1>Cineteca</h1>
  <div style="font-size:13px;opacity:.75;margin-bottom:6px">Formato del disco da aggiungere</div>
  <div class="fmt" id="fmt"></div>
</header>
<main>
  <section id="tab-add">
    <div class="row">
      <button class="big" id="bBar">Foto codice a barre</button>
      <button class="big alt" id="bCov">Foto copertina</button>
    </div>
    <input type="file" id="fBar" accept="image/*" capture="environment" class="hide">
    <input type="file" id="fCov" accept="image/*" capture="environment" class="hide">
    <div class="row">
      <input type="search" id="manual" placeholder="Oppure scrivi titolo o codice EAN">
      <button class="btn" id="bManual">Cerca</button>
    </div>
    <div class="status" id="st1"></div>
    <div id="res1"></div>
  </section>
  <section id="tab-find" class="hide">
    <div class="seg" id="where">
      <button data-w="local" class="on">Nella mia collezione</button>
      <button data-w="tmdb">Su TMDB</button>
    </div>
    <div class="chips" id="chips"><button data-f="all" class="on">Tutti</button><button data-f="k4">4K UHD</button><button data-f="bd">Blu-ray</button><button data-f="dvd">DVD</button></div>
    <input type="search" id="q" placeholder="Cerca un film…">
    <div class="status" id="st2"></div>
    <div id="res2"></div>
    <div class="foot" id="foot">
      <button class="btn ghost" id="bExp">Esporta backup</button>
      <button class="btn ghost" id="bImp">Importa backup</button>
      <input type="file" id="fImp" accept="application/json" class="hide">
    </div>
  </section>
</main>
<nav>
  <button data-t="add" class="on">Aggiungi</button>
  <button data-t="find">Cerca</button>
</nav>
<div id="cam" class="hide"><div class="hint" id="camhint"></div><video id="camv" playsinline muted></video>
  <div class="bar"><button class="btn ghost" id="camX">Annulla</button><button class="shutter" id="camS" aria-label="Scatta"></button><button class="btn ghost" id="camG">Galleria</button></div></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const KEY='6d228c55aeff585e47162e4725eb26fe';
const FORMATS={k4:'4K UHD',bd:'Blu-ray',dvd:'DVD'};
let fmt='k4', where='local', flt='all';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- DB locale (IndexedDB) ---------- */
const dbP=new Promise((ok,ko)=>{const r=indexedDB.open('cineteca',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('films',{keyPath:'id',autoIncrement:true});
  r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const tx=async(mode,fn)=>{const db=await dbP;return new Promise((ok,ko)=>{const t=db.transaction('films',mode);const q=fn(t.objectStore('films'));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>ko(t.error)})};
const dbAll=()=>tx('readonly',s=>s.getAll());
const dbPut=o=>tx('readwrite',s=>s.put(o));
const dbDel=id=>tx('readwrite',s=>s.delete(id));

/* ---------- TMDB ---------- */
const tmdb=async(p,q={})=>{const r=await fetch(`https://api.themoviedb.org/3${p}?`+new URLSearchParams({api_key:KEY,language:'it-IT',...q}));
  if(!r.ok)throw new Error('TMDB '+r.status);return r.json()};
const searchTmdb=q=>tmdb('/search/movie',{query:q,include_adult:'false'}).then(d=>d.results||[]);

async function addFromTmdb(id,ean){
  toast('Salvataggio…');
  const d=await tmdb('/movie/'+id,{append_to_response:'credits'});
  const poster=await posterData(d.poster_path)||null;
  const crew=d.credits?.crew||[];
  await dbPut({tmdbId:d.id,title:d.title,original:d.original_title,year:(d.release_date||'').slice(0,4),
    overview:d.overview,runtime:d.runtime,genres:(d.genres||[]).map(g=>g.name),
    director:crew.filter(c=>c.job==='Director').map(c=>c.name).join(', '),
    cast:(d.credits?.cast||[]).slice(0,5).map(c=>c.name).join(', '),
    rating:d.vote_average?+d.vote_average.toFixed(1):null,format:fmt,ean:ean||'',poster,posterPath:d.poster_path,added:Date.now()});
  toast(`Aggiunto: ${d.title} (${FORMATS[fmt]})`);
}

/* ---------- Locandine (scaricate e convertite in data URL, così si vedono sempre) ---------- */
const pc={};
const toDataURL=b=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.onerror=()=>r('');x.readAsDataURL(b)});
async function posterData(path){if(!path)return '';if(pc[path])return pc[path];
  try{const r=await fetch('https://image.tmdb.org/t/p/w342'+path);if(!r.ok)return '';return pc[path]=await toDataURL(await r.blob())}catch(e){return ''}}
async function hydrate(root){
  root.querySelectorAll('img[data-pp]').forEach(async im=>{const s=await posterData(im.dataset.pp);if(s)im.src=s});
  const ims=[...root.querySelectorAll('img[data-lid]')];if(!ims.length)return;
  const all=await dbAll();
  ims.forEach(async im=>{const f=all.find(x=>x.id==im.dataset.lid);if(!f)return;
    let s=f.poster;if(s instanceof Blob)s=await toDataURL(s);
    if(!s){try{let pp=f.posterPath;if(!pp){pp=(await tmdb('/movie/'+f.tmdbId)).poster_path;f.posterPath=pp}
      s=await posterData(pp);if(s){f.poster=s;await dbPut(f)}}catch(e){}}
    if(s)im.src=s});
}

/* ---------- UI ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200)}
function renderFmt(){$('#fmt').innerHTML=Object.entries(FORMATS).map(([k,v])=>`<button data-f="${k}" class="${k===fmt?'on':''}">${v}</button>`).join('')}
$('#fmt').onclick=e=>{const f=e.target.dataset.f;if(f){fmt=f;renderFmt()}};
document.querySelector('nav').onclick=e=>{const t=e.target.dataset.t;if(!t)return;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('#tab-add').classList.toggle('hide',t!=='add');$('#tab-find').classList.toggle('hide',t!=='find');
  if(t==='find')runFind()};
$('#where').onclick=e=>{const w=e.target.dataset.w;if(!w)return;where=w;
  document.querySelectorAll('#where button').forEach(b=>b.classList.toggle('on',b.dataset.w===w));
  $('#q').placeholder=w==='local'?'Titolo, regista, anno… (vuoto = tutta la collezione)':'Cerca un film su TMDB…';
  $('#foot').classList.toggle('hide',w!=='local');$('#chips').classList.toggle('hide',w!=='local');runFind()};
$('#chips').onclick=e=>{const f=e.target.dataset.f;if(!f)return;flt=f;document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',b.dataset.f===f));runFind()};

const tagH=f=>`<span class="tag ${f}">${FORMATS[f]}</span>`;
function cardTmdb(m){
  const img=m.poster_path?`<img class="p" data-pp="${m.poster_path}" src="https://image.tmdb.org/t/p/w154${m.poster_path}" alt="">`:'<div class="ph"></div>';
  return `<div class="card">${img}<div style="flex:1;min-width:0"><div class="t">${esc(m.title)}</div>
  <div class="meta">${(m.release_date||'').slice(0,4)||'—'}${m.original_title&&m.original_title!==m.title?' · '+esc(m.original_title):''}</div>
  ${m.overview?`<details><summary>Trama</summary><p>${esc(m.overview)}</p></details>`:''}
  <div class="acts"><button class="btn" data-add="${m.id}">Aggiungi come ${FORMATS[fmt]}</button></div></div></div>`}
function cardLocal(g){const f=g[0];
  return `<div class="card"><img class="p" data-lid="${f.id}" alt=""><div style="flex:1;min-width:0"><div class="t">${esc(f.title)}</div>
  <div class="meta">${g.map(x=>tagH(x.format)).join('')}${esc(f.year)}${f.runtime?' · '+f.runtime+' min':''}${f.rating?' · ★ '+f.rating:''}</div>
  <div class="meta">${esc(f.director)}${f.genres?.length?' · '+esc(f.genres.join(', ')):''}</div>
  <details><summary>Dettagli</summary><p>${esc(f.overview)}</p><p class="meta">${f.cast?'Cast: '+esc(f.cast):''}</p></details>
  ${g.map(x=>`<div class="acts">${tagH(x.format)}<button class="btn ghost" data-fmt="${x.id}">Cambia formato</button><button class="btn del" data-del="${x.id}">Elimina</button></div>`).join('')}</div></div>`}

/* ---------- Aggiungi ---------- */
let lastEan='';
async function handleResults(list,st,box){
  st.textContent=list.length?`${list.length} risultati — tocca “Aggiungi” su quello giusto.`:'Nessun risultato. Prova a correggere il titolo qui sopra.';
  box.innerHTML=list.slice(0,10).map(cardTmdb).join('');hydrate(box);
}
async function smartSearch(text){
  const st=$('#st1'),box=$('#res1');box.innerHTML='';
  text=text.trim();if(!text)return;
  try{
    if(/^\d{8,14}$/.test(text)){
      lastEan=text;st.textContent='Cerco il codice '+text+'…';
      const title=await eanToTitle(text);
      if(!title){st.textContent='Codice '+text+' non riconosciuto. Scrivi il titolo qui sopra e premi Cerca.';return}
      $('#manual').value=title;text=title;
    }
    st.textContent='Cerco su TMDB…';
    handleResults(await searchTmdb(text),st,box);
  }catch(e){st.textContent='Errore: '+e.message+' (sei online?)'}
}
async function eanToTitle(ean){
  try{
    const r=await fetch('https://api.upcitemdb.com/prod/trial/lookup?upc='+ean);
    const j=await r.json();const t=j.items?.[0]?.title;
    return t?cleanTitle(t):'';
  }catch(e){return ''}
}
const cleanTitle=t=>t.replace(/\[[^\]]*\]|\([^)]*\)/g,' ')
  .replace(/\b(blu-?ray|4k|uhd|ultra\s*hd|dvd|steelbook|edizione|special|limited|collector'?s?|disc|dischi|\+|digital|copy|hd|2160p|1080p|ita|italiano|region|free|import)\b/gi,' ')
  .replace(/[-–:,]+\s*$/,'').replace(/\s+/g,' ').trim();

$('#bManual').onclick=()=>smartSearch($('#manual').value);
$('#manual').onkeydown=e=>{if(e.key==='Enter')smartSearch(e.target.value)};
$('#res1').onclick=async e=>{const id=e.target.dataset.add;if(!id)return;
  const dup=(await dbAll()).find(f=>f.tmdbId==id&&f.format===fmt);
  if(dup&&!confirm('Hai già questo film in '+FORMATS[fmt]+'. Aggiungerlo di nuovo?'))return;
  e.target.disabled=true;try{await addFromTmdb(+id,lastEan);lastEan=''}catch(err){toast('Errore: '+err.message)}e.target.disabled=false};

/* Codice a barre da foto */
$('#bBar').onclick=()=>openCam('bar');
$('#fBar').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)readBarcode(f)};
async function readBarcode(f){
  const st=$('#st1');st.textContent='Leggo il codice a barre…';
  let code='';
  try{
    if('BarcodeDetector' in window){
      const bmp=await createImageBitmap(f);
      const r=await new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}).detect(bmp);
      code=r[0]?.rawValue||'';
    }
    if(!code&&window.ZXing){
      const url=URL.createObjectURL(f);
      try{code=(await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(url)).getText()}catch(_){}
      URL.revokeObjectURL(url);
    }
  }catch(err){}
  if(!code){st.textContent='Codice non letto. Riprova da più vicino e ben illuminato, oppure digitalo a mano.';return}
  $('#manual').value=code;smartSearch(code);
};

/* Copertina da foto (OCR) */
$('#bCov').onclick=()=>openCam('cov');
async function shrink(file,max=1400){
  const bmp=await createImageBitmap(file);const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=bmp.width*s;c.height=bmp.height*s;
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return c}
$('#fCov').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)readCover(f)};
async function readCover(f){
  const st=$('#st1');st.textContent='Leggo il testo della copertina (può richiedere qualche secondo)…';
  try{
    const {data}=await Tesseract.recognize(await shrink(f),'ita+eng');
    const lines=data.lines.map(l=>({t:l.text.replace(/[^\p{L}\p{N}\s:'’!&-]/gu,' ').replace(/\s+/g,' ').trim(),h:l.bbox.y1-l.bbox.y0}))
      .filter(l=>l.t.length>=3&&/\p{L}{3}/u.test(l.t)).sort((a,b)=>b.h-a.h);
    const guess=cleanTitle(lines[0]?.t||'');
    if(!guess){st.textContent='Testo non leggibile. Scrivi il titolo a mano.';return}
    $('#manual').value=guess;smartSearch(guess);
  }catch(err){st.textContent='OCR non disponibile (serve connessione). Scrivi il titolo a mano.'}
};

/* ---------- Fotocamera ---------- */
let stream,camMode,scanT;
const BF=['ean_13','ean_8','upc_a','upc_e'];
async function openCam(mode){
  camMode=mode;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920}},audio:false});
  }catch(e){
    $('#st1').textContent='Fotocamera non accessibile (serve https e il permesso). Apro la fotocamera di sistema.';
    $(mode==='bar'?'#fBar':'#fCov').click();return}
  const v=$('#camv');v.srcObject=stream;await v.play().catch(()=>{});
  $('#cam').classList.remove('hide');
  $('#camhint').textContent=mode==='bar'?'Inquadra il codice a barre: lo leggo da solo':'Inquadra la copertina e scatta';
  if(mode==='bar'&&'BarcodeDetector' in window){
    const det=new BarcodeDetector({formats:BF});let busy=false;
    scanT=setInterval(async()=>{if(busy)return;busy=true;
      try{const r=await det.detect(v);if(r[0]){const c=r[0].rawValue;closeCam();$('#manual').value=c;smartSearch(c)}}catch(e){}
      busy=false},350);
  }
}
function closeCam(){clearInterval(scanT);stream?.getTracks().forEach(t=>t.stop());stream=null;$('#camv').srcObject=null;$('#cam').classList.add('hide')}
$('#camX').onclick=closeCam;
$('#camG').onclick=()=>{const m=camMode;closeCam();$(m==='bar'?'#fBar':'#fCov').click()};
$('#camS').onclick=async()=>{const v=$('#camv');if(!v.videoWidth)return;
  const c=document.createElement('canvas'),k=Math.min(1,1600/Math.max(v.videoWidth,v.videoHeight));
  c.width=v.videoWidth*k;c.height=v.videoHeight*k;c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  const m=camMode;closeCam();const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));
  m==='bar'?readBarcode(blob):readCover(blob)};

/* ---------- Cerca ---------- */
let timer;
$('#q').oninput=()=>{clearTimeout(timer);timer=setTimeout(runFind,where==='local'?150:500)};
async function runFind(){
  const q=$('#q').value.trim(),st=$('#st2'),box=$('#res2');
  if(where==='local'){
    const all=(await dbAll()).sort((a,b)=>a.title.localeCompare(b.title,'it'));
    const groups={};all.forEach(f=>(groups[f.tmdbId||f.title+f.year]??=[]).push(f));
    const n=q.toLowerCase();
    const list=Object.values(groups).filter(g=>(flt==='all'||g.some(x=>x.format===flt))&&
      (!n||g.some(f=>[f.title,f.original,f.director,f.year,f.cast,FORMATS[f.format],f.ean].join(' ').toLowerCase().includes(n))));
    st.textContent=`${list.length} film (${all.length} dischi in totale)`;
    box.innerHTML=list.length?list.map(cardLocal).join(''):'<div class="meta">Nessun film trovato. Usa “Aggiungi” per scansionare il primo.</div>';
    hydrate(box);
  }else{
    if(!q){st.textContent='Scrivi un titolo per cercare su TMDB.';box.innerHTML='';return}
    st.textContent='Cerco su TMDB…';
    try{const l=await searchTmdb(q);st.textContent=`${l.length} risultati su TMDB`;box.innerHTML=l.slice(0,15).map(cardTmdb).join('');hydrate(box)}
    catch(e){st.textContent='Errore: '+e.message}
  }
}
$('#res2').onclick=async e=>{const d=e.target.dataset;
  if(d.add){e.target.disabled=true;try{await addFromTmdb(+d.add,'')}catch(err){toast('Errore: '+err.message)}e.target.disabled=false}
  if(d.del&&confirm('Eliminare questo film dalla collezione?')){await dbDel(+d.del);runFind()}
  if(d.fmt){const f=(await dbAll()).find(x=>x.id==d.fmt);const keys=Object.keys(FORMATS);
    f.format=keys[(keys.indexOf(f.format)+1)%keys.length];await dbPut(f);toast('Formato: '+FORMATS[f.format]);runFind()}};

/* ---------- Backup ---------- */
$('#bExp').onclick=async()=>{
  const all=await dbAll();
  for(const f of all){if(f.poster instanceof Blob){f.poster=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f.poster)})}}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(all)],{type:'application/json'}));
  a.download='cineteca-backup.json';a.click()};
$('#bImp').onclick=()=>$('#fImp').click();
$('#fImp').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  const list=JSON.parse(await f.text());
  for(const o of list){delete o.id;await dbPut(o)}
  toast(list.length+' film importati');runFind()};

renderFmt();
</script>
</body>
</html>
